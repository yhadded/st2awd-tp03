<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>TP03 · Ex1 — SceneVR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="js/vr.js"></script>
  <link rel="stylesheet" href="css/vr.css">
</head>
<body>
  <a class="back" href="./">← TP03</a>
  <div class="hud">
    <b>Casque :</b> bouton VR ↘ · joystick gauche = se déplacer · joystick droit = tourner la vue<br>
    <b>Bureau :</b> clic-glisser pour regarder, <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> pour marcher
  </div>

  <!-- shadow : active le shadow map du renderer (PCF soft = bords adoucis) -->
  <a-scene shadow="type: pcfsoft" renderer="antialias: true; anisotropy: 8" background="color: #bcd9f2"
           fog="type: linear; color: #bcd9f2; near: 18; far: 45">
    <a-assets>
      <img id="floor" src="assets/floor.png">
    </a-assets>

    <!-- lumière ambiante : éclaire uniformément (sans direction, sans ombre) -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.45"></a-entity>
    <!--
      lumière directionnelle = soleil : castShadow + caméra d'ombre dimensionnée
      pour couvrir la zone de jeu (±10 m) ; shadowBias réduit l'"acné" d'ombre.
    -->
    <a-entity light="type: directional; color: #fff6e5; intensity: 1.0; castShadow: true;
                     shadowMapWidth: 2048; shadowMapHeight: 2048; shadowBias: -0.0005;
                     shadowCameraLeft: -10; shadowCameraRight: 10; shadowCameraTop: 10; shadowCameraBottom: -10;
                     shadowCameraNear: 0.5; shadowCameraFar: 40"
              position="4 8 3"></a-entity>

    <!-- sol : reçoit les ombres -->
    <a-plane rotation="-90 0 0" width="30" height="30" material="src: #floor; repeat: 15 15; roughness: 0.9"
             shadow="cast: false; receive: true"></a-plane>

    <!-- objets simples : projettent ET reçoivent des ombres -->
    <a-box position="-1 0.5 -3" rotation="0 25 0" color="#ef5350" shadow="cast: true; receive: true"></a-box>
    <a-sphere position="0.6 0.6 -3.4" radius="0.6" color="#42a5f5" shadow="cast: true; receive: true"></a-sphere>
    <a-cylinder position="2.2 0.75 -4" radius="0.35" height="1.5" color="#ffca28" shadow="cast: true; receive: true"></a-cylinder>
    <a-box position="-2.6 1 -5" width="0.8" height="2" depth="0.8" color="#8d6e63" shadow="cast: true; receive: true"></a-box>
    <a-torus position="0 2.2 -5" radius="0.5" radius-tubular="0.1" color="#ab47bc" shadow="cast: true; receive: true"
             animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"></a-torus>

    <!--
      Rig joueur : on déplace le RIG (pas la caméra), car en VR la position de la
      caméra et des manettes est imposée par le casque (tracking 6DoF).
      - #head      : caméra (hauteur 1.6 m hors VR, remplacée par le casque en VR)
      - #leftHand  : manette gauche (joystick = déplacement)
      - #rightHand : manette droite (joystick = rotation)
    -->
    <a-entity id="rig" thumbstick-locomotion="leftHand: #leftHand; rightHand: #rightHand; camera: #head; speed: 2.5; turnSpeed: 120">
      <a-entity id="head" camera position="0 1.6 0" look-controls wasd-controls></a-entity>
      <a-entity id="leftHand" hand-controls="hand: left; handModelStyle: lowPoly; color: #f5d0b5"></a-entity>
      <a-entity id="rightHand" hand-controls="hand: right; handModelStyle: lowPoly; color: #f5d0b5"></a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
