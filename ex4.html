<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>TP03 · Ex4 — Cibles &amp; particules</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@c-frame/aframe-physics-system@4.2.4/dist/aframe-physics-system.min.js"></script>
  <script src="js/vr.js"></script>
  <link rel="stylesheet" href="css/vr.css">
</head>
<body>
  <a class="back" href="./">← TP03</a>
  <div class="hud">
    <b>Casque :</b> prenez le pistolet (<b>grip</b>), tirez (<b>gâchette</b>) sur les cibles qui apparaissent toutes les 2 s.<br>
    <b>Bureau :</b> approchez-vous de la table, visez le pistolet, <kbd>G</kbd> pour le prendre, <kbd>F</kbd> pour tirer
  </div>

  <a-scene shadow="type: pcfsoft" renderer="antialias: true; anisotropy: 8" background="color: #bcd9f2"
           fog="type: linear; color: #bcd9f2; near: 18; far: 45"
           physics="driver: local; gravity: -9.8; friction: 0.4; restitution: 0.2">
    <a-assets>
      <img id="floor" src="assets/floor.png">
      <a-asset-item id="pistol" src="assets/pistol.glb"></a-asset-item>
      <audio id="shotSound" src="assets/shot.wav" preload="auto"></audio>
      <audio id="hitSound" src="assets/hit.wav" preload="auto"></audio>
    </a-assets>

    <a-entity light="type: ambient; intensity: 0.45"></a-entity>
    <a-entity light="type: directional; color: #fff6e5; intensity: 1.0; castShadow: true;
                     shadowMapWidth: 2048; shadowMapHeight: 2048; shadowBias: -0.0005;
                     shadowCameraLeft: -10; shadowCameraRight: 10; shadowCameraTop: 10; shadowCameraBottom: -10"
              position="4 8 3"></a-entity>

    <a-plane rotation="-90 0 0" width="30" height="30" material="src: #floor; repeat: 15 15; roughness: 0.9"
             shadow="cast: false; receive: true"></a-plane>
    <a-box static-body width="30" height="1" depth="30" position="0 -0.5 0" visible="false"></a-box>

    <!-- table -->
    <a-entity position="0 0 -1.2">
      <a-box static-body position="0 0.85 0" width="1.6" height="0.1" depth="0.8" color="#8d6e63" shadow></a-box>
      <a-box position="-0.7 0.4 -0.3" width="0.08" height="0.8" depth="0.08" color="#6d4c41" shadow></a-box>
      <a-box position="0.7 0.4 -0.3" width="0.08" height="0.8" depth="0.08" color="#6d4c41" shadow></a-box>
      <a-box position="-0.7 0.4 0.3" width="0.08" height="0.8" depth="0.08" color="#6d4c41" shadow></a-box>
      <a-box position="0.7 0.4 0.3" width="0.08" height="0.8" depth="0.08" color="#6d4c41" shadow></a-box>
    </a-entity>

    <!--
      L'arme : modèle 3D glTF + corps physique composé de 2 boîtes (culasse + crosse),
      bien plus fiable qu'une forme "mesh". class="grabbable" => saisissable.
      gun :
        speed         vitesse initiale de la balle (m/s)
        gravityScale  gravité appliquée aux balles (1 = normale, 0 = trajectoire droite)
        gripRotation  pose de l'arme dans la main (voir vr.js)
      sound : son de tir (pool de 8 voix pour les tirs rapprochés)
    -->
    <a-entity id="gun" class="grabbable" gltf-model="#pistol"
              position="0 0.93 -1.1" rotation="0 90 90"
              dynamic-body="shape: none; mass: 0.8; angularDamping: 0.3"
              shape__slide="shape: box; halfExtents: 0.018 0.02 0.095; offset: 0 0.055 -0.07"
              shape__grip="shape: box; halfExtents: 0.016 0.055 0.024"
              gun="muzzle: #muzzle; speed: 20; gravityScale: 0.6; projectileMass: 0.05"
              sound="src: #shotSound; poolSize: 8; volume: 0.7" shadow>
      <a-entity id="muzzle" position="0 0.058 -0.22"></a-entity>
    </a-entity>

    <!--
      Cibles :
      - quelques cibles fixes au départ (cube, cône, sphère) ;
      - target-spawner en fait apparaître une nouvelle toutes les 2 s (max 8),
        de forme / couleur / position aléatoires, dans un arc devant le joueur.
      Chaque cible a le composant `target` : à l'impact d'une balle (événement
      collide du moteur physique) -> son 3D (hit.wav) + particules + disparition.
    -->
    <a-box class="target" target static-body position="-1.5 1.5 -6" width="0.6" height="0.6" depth="0.6" color="#ef5350" shadow="cast: true"></a-box>
    <a-cone class="target" target static-body position="0 1.8 -7" radius-bottom="0.4" radius-top="0" height="0.8" color="#ab47bc" shadow="cast: true"></a-cone>
    <a-sphere class="target" target static-body position="1.6 1.3 -6" radius="0.35" color="#26a69a" shadow="cast: true"></a-sphere>
    <a-entity target-spawner="interval: 2000; max: 8; minDist: 5; maxDist: 11; arc: 140"></a-entity>

    <!-- tableau des scores au-dessus de la table -->
    <a-entity position="0 2.1 -2">
      <a-plane width="1.3" height="0.36" color="#1d2129"></a-plane>
      <a-entity position="0 0 0.01" score-board></a-entity>
    </a-entity>

    <a-entity id="rig" thumbstick-locomotion="leftHand: #leftHand; rightHand: #rightHand; camera: #head">
      <a-entity id="head" camera position="0 1.6 0" look-controls wasd-controls></a-entity>
      <a-entity id="leftHand" hand-controls="hand: left; color: #f5d0b5" grabber></a-entity>
      <a-entity id="rightHand" hand-controls="hand: right; color: #f5d0b5" grabber></a-entity>
    </a-entity>
    <a-entity desktop-debug="hand: #rightHand; camera: #head"></a-entity>
  </a-scene>

</body>
</html>
